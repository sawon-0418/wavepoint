name: Daily official data sync

on:
  # GitHub Actions의 cron은 UTC 기준이다: 매일 03:30 KST.
  schedule:
    - cron: "30 18 * * *"
  # 배포 직후 또는 장애 복구 시 Actions 화면에서 수동 실행할 수 있다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync fishing spots and protected areas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAVEPOINT_SYNC_URL: ${{ secrets.WAVEPOINT_SYNC_URL }}
      CRON_SYNC_TOKEN: ${{ secrets.CRON_SYNC_TOKEN }}
    steps:
      - name: Trigger secure Render sync
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 \
            --request POST "$WAVEPOINT_SYNC_URL" \
            --header "X-Cron-Sync-Token: $CRON_SYNC_TOKEN"

  cleanup-pending-users:
    name: Remove expired unverified users
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Remove users pending email verification for 24 hours
        run: python cleanup_pending_users.py
